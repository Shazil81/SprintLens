# Local containers use PostgreSQL already running on the host device.
x-backend: &backend
  build: ./backend
  env_file: .env.docker.local
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: [sh, -c, "python manage.py migrate --noinput && exec python -m gunicorn config.wsgi:application --config gunicorn.conf.py"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=INFO, --schedule=/var/lib/celery/celerybeat-schedule]
    volumes:
      - beat-data:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redis-data:
  beat-data:
